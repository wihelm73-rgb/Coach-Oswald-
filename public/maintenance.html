<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COACH OSWALD — Maintenance</title>
    <style>
      :root {
        --primary-gold: #D4AF37;
        --primary-orange: #FF6B35;
        --primary-copper: #B87333;
        --dark-bg: #1a1a1a;
        --light-text: #f5f5f5;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: linear-gradient(135deg, #1a1a1a 0%, #3a2a1a 100%);
        color: var(--light-text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .card {
        width: 100%;
        max-width: 520px;
        text-align: center;
        background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
        border: 2px solid var(--primary-gold);
        border-radius: 16px;
        padding: 50px 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: linear-gradient(90deg, var(--primary-orange) 0%, var(--primary-copper) 100%);
        font-size: 34px;
        margin-bottom: 24px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .brand {
        color: var(--primary-gold);
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 14px;
      }

      h1 {
        color: var(--light-text);
        font-size: 26px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 18px;
      }

      p {
        color: #b8b0a0;
        font-size: 16px;
        line-height: 1.7;
      }

      .divider {
        width: 60px;
        height: 3px;
        margin: 24px auto;
        background: linear-gradient(90deg, var(--primary-orange) 0%, var(--primary-copper) 100%);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">🛠️</div>
      <div class="brand">Coach Oswald</div>
      <h1>Site en maintenance</h1>
      <p>
        Nous effectuons actuellement une mise à jour du site.<br />
        Merci de votre patience, nous serons de retour très bientôt.
      </p>
      <div class="divider"></div>
      <p>À très vite !</p>
    </main>
  </body>
</html>
